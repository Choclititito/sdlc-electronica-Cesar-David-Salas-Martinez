[project]
name = "sdlc-electronica-cesar-david"
version = "0.1.0"
description = "Proyecto de SDLC en Electrónica con calidad automatizada"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.0",
]
[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

# Configuración de Setuptools para evitar el error de múltiples paquetes planos
[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# RUFF — Linting y formato
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["app", "tests"]
extend-exclude = ["semana0", "semana1", "semana2"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errores
    "F",  # pyflakes (variables no usadas, imports rotos)
    "I",  # isort (orden de imports)
    "UP", # pyupgrade (sintaxis moderna)
    "B",  # flake8-bugbear (malas prácticas)
]

# ---------------------------------------------------------------------------
# PYTEST — Pruebas y cobertura
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--cov=app --cov-fail-under=80 --cov-report=term-missing"

# ---------------------------------------------------------------------------
# MYPY — Verificación estática de tipos
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
files = ["app"]
