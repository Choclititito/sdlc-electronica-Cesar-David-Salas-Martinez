[project]
name = "semana2-proyecto"
version = "0.1.0"
description = "Proyecto con Definition of Done y calidad automatizada"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",  # ejemplo — reemplaza por las libs reales de tu proyecto
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-bdd>=7.0",
]

# ---------------------------------------------------------------------------
# RUFF — linting y formato
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (errores de estilo)
    "F",   # pyflakes (errores lógicos: imports/variables no usadas, etc.)
    "I",   # isort (orden de imports)
    "UP",  # pyupgrade (sintaxis moderna de Python)
    "B",   # flake8-bugbear (bugs comunes / malas prácticas)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # ejemplo: relajar alguna regla solo en tests si hace falta

# ---------------------------------------------------------------------------
# PYTEST — tests + cobertura
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
bdd_features_base_dir = "features/"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# MYPY — chequeo de tipos
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false  # los tests suelen quedar exentos de esta regla
